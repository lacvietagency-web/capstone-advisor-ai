{% load static %}<!doctype html>
<html lang="vi" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lỗi hệ thống — Capstone AI</title>
  <script>(function(){var c="system";try{c=localStorage.getItem("atlas-theme")||"system"}catch(e){}var d=c==="dark"||(c==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-bs-theme",d?"dark":"light")})();</script>
  <link rel="icon" type="image/svg+xml" href="{% static 'brand/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/atlas.css' %}">
</head>
<body>
  <main class="at-canvas" id="main">
    <div class="at-error-layout">
      <section class="at-panel at-error-panel" aria-labelledby="atErrTitle">
        <div class="at-error-illustration" aria-hidden="true">
          <span class="at-icon" style="--i:url('{% static 'icons/settings.svg' %}');--s:48px"></span>
          <span class="at-error-badge"><span class="at-icon" style="--i:url('{% static 'icons/triangle-alert.svg' %}');--s:22px"></span></span>
        </div>
        <div class="at-error-code at-num">500</div>
        <h1 class="h2" id="atErrTitle">Đã xảy ra lỗi khi xử lý yêu cầu.</h1>
        <p class="at-error-copy">Dữ liệu đã lưu trước đó không bị ảnh hưởng. Thử lại sau ít phút; nếu vẫn lỗi, báo cho Văn phòng Khoa.</p>
        <div class="at-row" style="justify-content:center">
          <a href="" class="btn btn-secondary">Thử lại</a>
          <a href="/trang-chu/" class="btn btn-primary">Quay về trang chủ</a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>
