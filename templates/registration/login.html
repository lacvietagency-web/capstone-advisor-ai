{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-5"><div class="card shadow-sm"><div class="card-body p-4">
  <h1 class="h4 mb-3">Đăng nhập</h1>
  {% if form.errors %}<div class="alert alert-danger">Sai tên đăng nhập hoặc mật khẩu.</div>{% endif %}
  <form method="post">{% csrf_token %}
    <div class="mb-3"><label class="form-label">Tên đăng nhập</label><input class="form-control" name="username" autofocus required></div>
    <div class="mb-3"><label class="form-label">Mật khẩu</label><input class="form-control" type="password" name="password" required></div>
    <button class="btn btn-primary w-100">Đăng nhập</button>
  </form>
</div></div></div></div>
{% endblock %}
