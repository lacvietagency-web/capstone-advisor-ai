{% load static %}<!doctype html>
<html lang="vi" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lỗi hệ thống — Capstone AI</title>
  <script>(function(){var c="system";try{c=localStorage.getItem("atlas-theme")||"system"}catch(e){}var d=c==="dark"||(c==="system"&&window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches);document.documentElement.setAttribute("data-bs-theme",d?"dark":"light")})();</script>
  <link rel="icon" type="image/svg+xml" href="{% static 'brand/favicon.svg' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/atlas.css' %}">
</head>
<body>
  <main class="at-canvas" id="main">
    <div class="at-empty at-empty--page">
      <img class="at-illus--light" src="{% static 'illus/error-500.svg' %}" alt="" width="240" height="160">
      <img class="at-illus--dark" src="{% static 'illus/dark/error-500.svg' %}" alt="" width="240" height="160">
      <div class="at-empty-title">Hệ thống gặp lỗi</div>
      <div class="at-empty-desc">Yêu cầu của bạn chưa được xử lý. Dữ liệu đã lưu trước đó không bị ảnh hưởng. Thử tải lại trang; nếu vẫn lỗi, báo cho Văn phòng Khoa.</div>
      <div class="at-empty-actions">
        <a href="" class="btn btn-primary">Tải lại trang</a>
        <a href="/trang-chu/" class="btn btn-text">Về trang chủ</a>
      </div>
    </div>
  </main>
</body>
</html>
