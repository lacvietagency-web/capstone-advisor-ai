{% load static %}{# Bootstrap CSS: CDN trước, lỗi thì dùng bản trong dự án (settings.ASSETS_FROM_CDN) #}
{% if assets_cdn %}<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" crossorigin="anonymous" onerror="this.onerror=null;this.href='{% static 'vendor/bootstrap.min.css' %}'">{% else %}<link rel="stylesheet" href="{% static 'vendor/bootstrap.min.css' %}">{% endif %}
