<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Capstone Advisor AI{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand bg-primary navbar-dark mb-4">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{% url 'home' %}">Capstone Advisor AI</a>
    {% if user.is_authenticated %}
    <div class="d-flex align-items-center gap-3 text-white">
      <span>{{ user.get_full_name|default:user.username }} · {{ user.get_role_display }}</span>
      {% if user.is_faculty_admin %}<a class="btn btn-sm btn-light" href="/quan-tri/">Quản trị</a>{% endif %}
      <form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="btn btn-sm btn-outline-light">Đăng xuất</button></form>
    </div>
    {% endif %}
  </div>
</nav>
<main class="container">{% block content %}{% endblock %}</main>
</body>
</html>
